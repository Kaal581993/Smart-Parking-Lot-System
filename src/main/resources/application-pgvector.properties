spring.application.name=smart.parking.lot-pgvector

# PostgreSQL must have the pgvector extension installed:
# CREATE EXTENSION IF NOT EXISTS vector;
spring.datasource.url=${PGVECTOR_DB_URL:jdbc:postgresql://localhost:5432/smart_parking}
spring.datasource.username=${PGVECTOR_DB_USERNAME:postgres}
spring.datasource.password=${PGVECTOR_DB_PASSWORD:PostGres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.root=ERROR
