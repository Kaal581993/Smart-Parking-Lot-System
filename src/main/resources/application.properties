spring.application.name=smart.parking.lot
server.port=8080

# 1. Custom PERSISTENT Local File Database Path
# This creates a file named 'parkinglotdb.mv.db' inside a 'data' folder in your project directory
# 1. Custom PERSISTENT Local File Database Path
spring.datasource.url=jdbc:h2:file:./data/parkinglotdb;DB_CLOSE_DELAY=-1;IFEXISTS=FALSE

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=user
spring.jpa.hibernate.ddl-auto=create-drop

spring.datasource.initialize=true
spring.datasource.schema=classpath:schema.sql
spring.datasource.data=classpath:data.sql
spring.jpa.generate-ddl=true

# 2. H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allows you to access the console using objects inside frames (required in newer Boot versions)
spring.h2.console.settings.web-allow-others=true


# 3. JPA/Hibernate Properties
spring.jpa.show-sql=true
#spring.jpa.hibernate.ddl-auto=update
# Note: spring.jpa.generate-ddl is superseded by ddl-auto, you can omit it.



## 4. Initialization Scripts (if needed)
#spring.sql.init.schema-locations=classpath:schema.sql
#spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.mode=always

# Disable Spring Session trying to use Redis
spring.session.store-type=none



