spring.application.name=smart.parking.lot
server.port=8080
server.address=${SERVER_ADDRESS:0.0.0.0}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.profiles.default=pgvector
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Common JPA/Hibernate properties
spring.jpa.show-sql=true
spring.jpa.generate-ddl=false
spring.sql.init.mode=never

# Disable Spring Session trying to use Redis
spring.session.store-type=none

# DB Profiling
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=10

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
